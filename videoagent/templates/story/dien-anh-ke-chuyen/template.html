<!doctype html>
<html lang="vi"><head>{% include "head.html" %}
<style>
:root{--amber:#f2b45c}
body{background:#0a0705}
.bg{position:absolute;inset:-6%;background:radial-gradient(70% 55% at 35% 40%,#a8521f 0%,#4a1d0c 40%,#120805 75%),#120805;animation:slowZoom var(--dur) linear both}
.leak{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffcf8a44 45%,transparent 60%);mix-blend-mode:screen;animation:leak var(--dur) ease-in-out both}
@keyframes leak{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000c 100%)}
.bars::before,.bars::after{content:'';position:absolute;left:0;right:0;height:11%;background:#000;z-index:2;animation:barIn 1s cubic-bezier(.6,0,.2,1) both}
.bars::before{top:0;transform-origin:top}.bars::after{bottom:0;transform-origin:bottom}
@keyframes barIn{from{transform:scaleY(0)}}
.copy{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-55%);text-align:center;z-index:1}
.kicker{font-family:'Noto Serif',Georgia,serif;font-style:italic;color:var(--amber);font-size:calc(3.4vmin * var(--fit,1));letter-spacing:.06em;white-space:nowrap;max-height:6vmin;animation:fadeIn 1.2s .3s both}
.rule{width:14vmin;height:2px;margin:2.6vmin auto;background:var(--amber);transform-origin:center;animation:grow 1s .6s both}
@keyframes grow{from{transform:scaleX(0)}}
h1{font-family:'Noto Serif',Georgia,serif;font-weight:800;line-height:1.2;font-size:calc(8vmin * var(--fit,1));max-height:42vmin;text-shadow:0 1vmin 4vmin #000}
h1 .w{--d0:.9s;animation-duration:1.1s}
h1 .hl{color:var(--amber);font-style:italic}
p.sub{margin-top:3vmin;font-family:'Noto Serif',Georgia,serif;font-style:italic;color:#f1dcc4cc;font-size:calc(3.5vmin * var(--fit,1));line-height:1.5;max-height:16vmin;animation:fadeIn 1.4s 1.8s both}
.chapter{position:absolute;right:6%;bottom:13%;z-index:3;font:600 2.2vmin 'JetBrains Mono',monospace;letter-spacing:.3em;color:#ffffff66}
</style></head>
<body style="--dur:{{ duration }}s"><div class="stage">
  <div class="bg"></div><div class="leak"></div><div class="vignette"></div><div class="grain"></div>
  <div class="bars"></div>
  <div class="copy">
    <div class="kicker" data-fit="kicker">{{ kicker or ('Chương ' ~ index) }}</div>
    <div class="rule"></div>
    <h1 data-fit="headline">{% for w in words %}<span class="w{% if w.hl %} hl{% endif %}" style="--i:{{ loop.index0 }}">{{ w.text }}</span> {% endfor %}</h1>
    {% if subtext %}<p class="sub" data-fit="subtext">{{ subtext }}</p>{% endif %}
  </div>
  <div class="chapter">{{ index2 }} / {{ '%02d' % total }}</div>
</div></body></html>
