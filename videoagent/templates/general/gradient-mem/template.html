<!doctype html>
<html lang="vi"><head>{% include "head.html" %}
<style>
:root{--ink:#251a3d;--accent:#7b4dff}
body{background:#f4efff;color:var(--ink)}
.blob{position:absolute;border-radius:50%;filter:blur(7vmin);opacity:.85}
.b1{width:75vmin;height:75vmin;background:#ff9ec7;left:-25vmin;top:-10vmin;animation:float1 var(--dur) ease-in-out both}
.b2{width:70vmin;height:70vmin;background:#8fd3ff;right:-25vmin;top:30%;animation:float2 var(--dur) ease-in-out both}
.b3{width:60vmin;height:60vmin;background:#c3a6ff;left:10%;bottom:-20vmin;animation:float1 var(--dur) ease-in-out reverse both}
@keyframes float1{to{transform:translate(12vmin,8vmin) scale(1.1)}}
@keyframes float2{to{transform:translate(-10vmin,-6vmin) scale(.95)}}
.card{position:absolute;left:7%;right:7%;top:50%;transform:translateY(-50%);padding:6vmin 5.5vmin;border-radius:5vmin;background:#ffffff8c;border:1px solid #ffffffcc;box-shadow:0 4vmin 10vmin #5b3fa526;backdrop-filter:blur(14px);animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(-44%) scale(.96)}}
.kicker{display:inline-block;max-width:100%;padding:1vmin 2.4vmin;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:.1em;font-size:calc(2.5vmin * var(--fit,1));white-space:nowrap;animation:fadeUp .5s .3s both}
h1{margin-top:3vmin;font-weight:900;line-height:1.15;font-size:calc(8vmin * var(--fit,1));max-height:38vmin;letter-spacing:-.02em}
h1 .hl{background:linear-gradient(90deg,#7b4dff,#ff4d9d);-webkit-background-clip:text;color:transparent}
p.sub{margin-top:2.6vmin;font-size:calc(3.5vmin * var(--fit,1));line-height:1.5;color:#4f4566;max-height:16vmin;animation:fadeUp .7s 1.1s both}
.stat{margin-top:3vmin;font-weight:900;font-size:calc(7vmin * var(--fit,1));color:var(--accent);white-space:nowrap;max-height:10vmin;animation:fadeUp .6s 1.4s both}
.dots{position:absolute;left:0;right:0;bottom:9%;display:flex;justify-content:center;gap:1.4vmin}
.dots i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#251a3d33}
.dots i.on{width:4.4vmin;border-radius:9px;background:var(--ink)}
@media (min-aspect-ratio:1/1){.card{left:22%;right:22%}}
</style></head>
<body style="--dur:{{ duration }}s"><div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="card">
    {% if kicker %}<div class="kicker" data-fit="kicker">{{ kicker }}</div>{% endif %}
    <h1 data-fit="headline">{% for w in words %}<span class="w{% if w.hl %} hl{% endif %}" style="--i:{{ loop.index0 }}">{{ w.text }}</span> {% endfor %}</h1>
    {% if subtext %}<p class="sub" data-fit="subtext">{{ subtext }}</p>{% endif %}
    {% if stat %}<div class="stat" data-fit="stat">{{ stat }}</div>{% endif %}
  </div>
  <div class="dots">{% for i in range(total) %}<i class="{{ 'on' if i + 1 == index else '' }}"></i>{% endfor %}</div>
</div></body></html>
