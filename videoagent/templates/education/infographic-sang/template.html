<!doctype html>
<html lang="vi"><head>{% include "head.html" %}
<style>
:root{--ink:#1d1b19;--orange:#ff6a2b;--teal:#14a38b;--paper:#f7f1e6}
body{background:var(--paper);color:var(--ink)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#1d1b1914 1.2px,transparent 1.2px);background-size:4vmin 4vmin}
.blob{position:absolute;border-radius:50%;filter:blur(1px)}
.b1{width:60vmin;height:60vmin;right:-22vmin;top:-18vmin;background:#ffd9c2;animation:fadeIn 1s both}
.b2{width:40vmin;height:40vmin;left:-16vmin;bottom:8%;background:#c9efe6;animation:fadeIn 1s .2s both}
.num{position:absolute;top:8%;left:7%;width:22vmin;height:22vmin;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:10vmin;box-shadow:0 2vmin 0 #1d1b19;animation:pop .6s .1s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.kicker{position:absolute;top:12%;left:34%;right:7%;font-weight:800;letter-spacing:.12em;color:var(--teal);font-size:calc(3vmin * var(--fit,1));white-space:nowrap;animation:fadeUp .5s .3s both}
.copy{position:absolute;left:7%;right:7%;top:36%}
h1{font-weight:900;line-height:1.15;font-size:calc(8.6vmin * var(--fit,1));max-height:40vmin}
h1 .hl{background:linear-gradient(transparent 58%,#ffd23f 58%,#ffd23f 90%,transparent 90%) no-repeat;background-size:0 100%;animation:wordIn .55s forwards,mark .6s forwards;animation-delay:calc(var(--d0,.35s) + var(--i) * .08s),1.4s}
@keyframes mark{to{background-size:100% 100%}}
p.sub{margin-top:3vmin;font-size:calc(3.6vmin * var(--fit,1));line-height:1.5;color:#4a4540;max-height:17vmin;animation:fadeUp .7s 1.1s both}
.card{position:absolute;left:7%;bottom:15%;padding:2.4vmin 3.6vmin;border:.5vmin solid var(--ink);border-radius:2.4vmin;background:#fff;box-shadow:1.2vmin 1.2vmin 0 var(--ink);font-weight:900;font-size:calc(6vmin * var(--fit,1));max-width:86%;white-space:nowrap;color:var(--teal);animation:fadeUp .6s 1.4s both}
.progress{position:absolute;left:7%;right:7%;bottom:9%;display:flex;gap:1.4vmin}
.progress i{flex:1;height:1vmin;border-radius:9px;background:#1d1b1920}
.progress i.on{background:var(--orange)}
@media (min-aspect-ratio:1/1){.copy{top:34%;right:30%}.card{left:auto;right:7%;bottom:30%}}
</style></head>
<body style="--dur:{{ duration }}s"><div class="stage">
  <div class="dots"></div><div class="blob b1"></div><div class="blob b2"></div>
  <div class="num">{{ index }}</div>
  {% if kicker %}<div class="kicker" data-fit="kicker">{{ kicker }}</div>{% endif %}
  <div class="copy">
    <h1 data-fit="headline">{% for w in words %}<span class="w{% if w.hl %} hl{% endif %}" style="--i:{{ loop.index0 }}">{{ w.text }}</span> {% endfor %}</h1>
    {% if subtext %}<p class="sub" data-fit="subtext">{{ subtext }}</p>{% endif %}
  </div>
  {% if stat %}<div class="card" data-fit="stat">{{ stat }}</div>{% endif %}
  <div class="progress">{% for i in range(total) %}<i class="{{ 'on' if i < index else '' }}"></i>{% endfor %}</div>
</div></body></html>
