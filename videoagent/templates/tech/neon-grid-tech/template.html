<!doctype html>
<html lang="vi"><head>{% include "head.html" %}
<style>
:root{--cyan:#2ef2ff;--pink:#ff3fd8}
body{background:linear-gradient(#05010f 0%,#12032b 55%,#05010f 100%)}
.sun{position:absolute;left:50%;top:44%;width:56vmin;height:56vmin;margin-left:-28vmin;border-radius:50%;background:linear-gradient(#ff3fd8,#ff9a3f 70%);-webkit-mask:repeating-linear-gradient(#000 0 4vmin,#0000 4vmin 5vmin);opacity:.55;filter:blur(.2vmin);animation:fadeIn 1.2s both}
.floor{position:absolute;left:-50%;right:-50%;bottom:-6%;height:52%;perspective:40vmin;overflow:hidden}
.floor i{position:absolute;inset:0;transform:rotateX(62deg);transform-origin:top;background-image:linear-gradient(var(--cyan) 2px,transparent 2px),linear-gradient(90deg,var(--cyan) 2px,transparent 2px);background-size:8vmin 8vmin;opacity:.55;animation:run 1.2s linear infinite;-webkit-mask:linear-gradient(#0000,#000 40%)}
@keyframes run{to{background-position:0 8vmin}}
.horizon{position:absolute;left:0;right:0;top:48%;height:2px;background:var(--pink);box-shadow:0 0 3vmin var(--pink)}
.kicker{position:absolute;top:7%;left:7%;right:7%;font:700 calc(2.8vmin * var(--fit,1)) 'JetBrains Mono',monospace;color:var(--cyan);letter-spacing:.12em;white-space:nowrap;animation:fadeIn .5s .1s both}
.kicker::before{content:'[ ';color:var(--pink)}.kicker::after{content:' ]';color:var(--pink)}
.idx{position:absolute;top:7%;right:7%;font:700 2.6vmin 'JetBrains Mono',monospace;color:#ffffff66}
.copy{position:absolute;left:7%;right:7%;top:15%}
h1{font-weight:900;line-height:1.1;font-size:calc(9vmin * var(--fit,1));max-height:42vmin;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 0 2vmin #2ef2ff66}
h1 .hl{color:var(--pink);text-shadow:0 0 2.4vmin var(--pink)}
p.sub{margin-top:2.6vmin;font-size:calc(3.4vmin * var(--fit,1));line-height:1.45;color:#d8ccff;max-height:15vmin;animation:fadeUp .7s 1.1s both}
.stat{position:absolute;left:7%;right:7%;bottom:17%;text-align:center;font:800 calc(13vmin * var(--fit,1))/1.3 'JetBrains Mono',monospace;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;color:transparent;white-space:nowrap;filter:drop-shadow(0 0 2vmin #2ef2ff88);animation:glitch .9s .9s steps(6) both}
@keyframes glitch{0%{opacity:0;transform:translateX(-2vmin) skewX(20deg)}50%{opacity:1;transform:translateX(1vmin) skewX(-10deg)}100%{opacity:1;transform:none}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px);pointer-events:none}
@media (min-aspect-ratio:1/1){.copy{right:40%;top:18%}.stat{left:58%;bottom:auto;top:30%}}
</style></head>
<body style="--dur:{{ duration }}s"><div class="stage">
  <div class="sun"></div><div class="floor"><i></i></div><div class="horizon"></div>
  {% if kicker %}<div class="kicker" data-fit="kicker">{{ kicker }}</div>{% endif %}
  <div class="idx">{{ index2 }}/{{ '%02d' % total }}</div>
  <div class="copy">
    <h1 data-fit="headline">{% for w in words %}<span class="w{% if w.hl %} hl{% endif %}" style="--i:{{ loop.index0 }}">{{ w.text }}</span> {% endfor %}</h1>
    {% if subtext %}<p class="sub" data-fit="subtext">{{ subtext }}</p>{% endif %}
  </div>
  {% if stat %}<div class="stat" data-fit="stat">{{ stat }}</div>{% endif %}
  <div class="scan"></div>
</div></body></html>
