<!doctype html>
<html lang="vi"><head>{% include "head.html" %}
<style>
:root{--up:#22d37a;--down:#ff3b3b;--accent:#ff4d4d}
body{background:radial-gradient(120% 75% at 50% 38%,#5c0d0d 0%,#2a0606 45%,#080303 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,90,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,90,90,.07) 1px,transparent 1px);background-size:9vmin 9vmin;animation:fadeIn 1s both}
.glow{position:absolute;left:50%;top:40%;width:90vmin;height:90vmin;margin:-45vmin;border-radius:50%;background:radial-gradient(circle,#ff4d4d33,transparent 65%);animation:pulse 4s ease-in-out infinite}
.kicker{position:absolute;top:6%;left:6%;max-width:80%;padding:1.1vmin 2.6vmin;border-radius:99px;border:1px solid #ff4d4d88;background:#ff4d4d1f;color:#ff8a8a;font-weight:800;letter-spacing:.14em;font-size:calc(2.5vmin * var(--fit,1));white-space:nowrap;animation:fadeUp .6s .1s both}
.live{position:absolute;top:7%;right:7%;width:1.8vmin;height:1.8vmin;border-radius:50%;background:var(--down);box-shadow:0 0 2.5vmin var(--down);animation:pulse 1.1s infinite}
.chart{position:absolute;left:5%;right:5%;top:20%;height:38%;animation:chartZoom var(--dur) linear both}
@keyframes chartZoom{to{transform:scale(1.07)}}
.chart svg{width:100%;height:100%;overflow:visible}
.candle{opacity:0;animation:fadeUp .45s both;animation-delay:calc(.3s + var(--i) * .07s)}
.wick{stroke-width:.35}
.line{fill:none;stroke:#ff7070;stroke-width:.7;stroke-linejoin:round;filter:drop-shadow(0 0 1.2px #ff3b3b);stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .5s cubic-bezier(.45,0,.2,1) forwards}
.stat{position:absolute;top:13%;right:6%;font:800 calc(6vmin * var(--fit,1))/1.3 'JetBrains Mono',monospace;max-width:45%;white-space:nowrap;animation:fadeUp .6s 1.2s both;text-shadow:0 0 3vmin currentColor}
.stat.up{color:var(--up)}.stat.down,.stat.flat{color:var(--down)}
.copy{position:absolute;left:6%;right:6%;bottom:17%}
h1{font-weight:900;line-height:1.12;font-size:calc(8.4vmin * var(--fit,1));max-height:30vmin;letter-spacing:-.01em;text-shadow:0 .6vmin 3vmin #000a}
h1 .hl{color:var(--accent)}
p.sub{margin-top:2.4vmin;color:#f3d6d6cc;font-size:calc(3.4vmin * var(--fit,1));line-height:1.4;max-height:15vmin;animation:fadeUp .7s 1.1s both}
.bar{position:absolute;left:6%;right:6%;bottom:12.5%;height:.5vmin;background:#ffffff18;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:{{ (index / total * 100) | round(1) }}%;background:var(--accent);transform-origin:left;animation:grow 1s .4s both}
@keyframes grow{from{transform:scaleX(0)}}
.brand{position:absolute;left:6%;bottom:9%;font-size:2.2vmin;letter-spacing:.2em;color:#ffb3b399;font-weight:700}
@media (min-aspect-ratio:1/1){
  .chart{left:48%;right:4%;top:16%;height:62%}
  .copy{right:54%;bottom:24%}
  h1{font-size:calc(7.4vmin * var(--fit,1));max-height:36vmin}
  .stat{top:10%}
}
</style></head>
<body style="--dur:{{ duration }}s"><div class="stage">
  <div class="grid"></div><div class="glow"></div>
  {% if kicker %}<div class="kicker" data-fit="kicker">{{ kicker }}</div>{% endif %}
  <div class="live"></div>
  {% if stat %}<div class="stat {{ trend }}" data-fit="stat">{{ stat }}</div>{% endif %}
  <div class="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none">
    {% for c in candles %}
    <g class="candle" style="--i:{{ loop.index0 }}">
      <line class="wick" x1="{{ c.x }}" x2="{{ c.x }}" y1="{{ c.wick_top }}" y2="{{ c.wick_bottom }}" stroke="{{ '#22d37a' if c.up else '#ff3b3b' }}"/>
      <rect x="{{ c.x - 1.8 }}" y="{{ c.top }}" width="3.6" height="{{ c.height }}" fill="{{ '#22d37a' if c.up else '#ff3b3b' }}" rx=".4"/>
    </g>
    {% endfor %}
    <path class="line" pathLength="1" d="{{ line_path }}"/>
  </svg></div>
  <div class="copy">
    <h1 data-fit="headline">{% for w in words %}<span class="w{% if w.hl %} hl{% endif %}" style="--i:{{ loop.index0 }}">{{ w.text }}</span> {% endfor %}</h1>
    {% if subtext %}<p class="sub" data-fit="subtext">{{ subtext }}</p>{% endif %}
  </div>
  <div class="bar"><i></i></div>
  {% if brand %}<div class="brand">● {{ brand }}</div>{% endif %}
</div></body></html>
